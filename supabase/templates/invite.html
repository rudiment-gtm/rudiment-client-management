<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're invited to Encore</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background-color: #f4f4f5; margin: 0; padding: 40px 20px;">
  <div style="max-width: 480px; margin: 0 auto; background: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #00F0B5, #00B389); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#050A09" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <h1 style="color: #18181b; font-size: 24px; font-weight: 700; margin: 16px 0 8px;">Encore</h1>
    </div>

    <h2 style="color: #18181b; font-size: 20px; font-weight: 600; margin-bottom: 16px;">Finish setting up your account</h2>

    <p style="color: #52525b; font-size: 16px; line-height: 1.6; margin-bottom: 24px;">
      Click the button below to activate your 14-day trial and start mapping your book of business.
    </p>

    <a href="{{ .ConfirmationURL }}" style="display: block; background: linear-gradient(135deg, #00F0B5, #00B389); color: #050A09; text-decoration: none; padding: 14px 24px; border-radius: 8px; font-weight: 600; font-size: 16px; text-align: center; margin-bottom: 24px;">
      Activate My Account
    </a>

    <p style="color: #71717a; font-size: 14px; line-height: 1.5;">
      If you didn't request access to Encore, you can safely ignore this email.
    </p>

    <hr style="border: none; border-top: 1px solid #e4e4e7; margin: 32px 0;">

    <p style="color: #a1a1aa; font-size: 12px; text-align: center;">
      © 2026 Encore. All rights reserved.
    </p>
  </div>
</body>
</html>
